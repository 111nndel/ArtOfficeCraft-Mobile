function parseCSV(text){let rows=[],row=[],v='',q=false;const sep=text.split('\n')[0].includes(';')?';':',';for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===sep&&!q){row.push(v);v=''}else if(c==='\n'&&!q){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}row.push(v.replace(/\r$/,''));rows.push(row);return rows}
function validProject(f){if(!f||!['word','grid','deck','pdf'].includes(f.kind)||typeof f.name!=='string'||!f.content)return false;let c=f.content;if(f.kind==='word')return typeof c.html==='string';if(f.kind==='grid')return Array.isArray(c.sheets)&&c.sheets.length>0&&c.sheets.length<100&&c.sheets.every(s=>typeof s.name==='string'&&s.cells&&typeof s.cells==='object'&&s.styles&&typeof s.styles==='object');if(f.kind==='deck')return Array.isArray(c.slides)&&c.slides.length>0&&c.slides.length<500&&c.slides.every(s=>Array.isArray(s.objects));return Array.isArray(c.pages)&&c.pages.length>0&&c.pages.length<1000&&c.pages.every(p=>typeof p.title==='string')}
document.getElementById('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('Для макета выберите файл до 10 МБ');let text=await f.text(),name=f.name.replace(/\.[^.]+$/,'');if(/\.json$/i.test(f.name)){let data=JSON.parse(text);if(data.artofficecraft!==1||!validProject(data.file))throw Error('Некорректный проект ArtOfficeCraft');let x=data.file;x.id='f'+Date.now();x.modified=Date.now();if(x.kind==='word')x.content.html=sanitizeHTML(x.content.html);if(x.kind==='pdf')x.content.pages.forEach(p=>{p.comments??=[];p.form??={name:'',email:''};if(p.signature?.startsWith('data:')&&!/^data:image\/png;base64,/.test(p.signature))p.signature=''});if(x.kind==='deck')x.content.slides.forEach(s=>s.objects.forEach(o=>{o.id=String(o.id).replace(/[^a-zA-Z0-9_.-]/g,'');if(o.image&&!/^data:image\/(png|jpeg|webp|gif);base64,/.test(o.image))delete o.image}));if(x.kind==='grid'){x.content.sheet=Math.max(0,Math.min(x.content.sheets.length-1,Number(x.content.sheet)||0));x.content.sheets.forEach(s=>{Object.keys(s.cells).forEach(a=>s.cells[a]=String(s.cells[a]));Object.values(s.styles).forEach(st=>{if(!/^#[0-9a-f]{6}$/i.test(st.bg||''))delete st.bg})})}if(x.kind==='deck'){x.content.index=Math.max(0,Math.min(x.content.slides.length-1,Number(x.content.index)||0));x.content.slides.forEach(s=>{s.theme=[1,2,3].includes(+s.theme)?+s.theme:1;s.notes=String(s.notes||'');s.objects.forEach(o=>{o.text=String(o.text||'');for(const key of ['x','y','w','size','h'])if(o[key]!==undefined)o[key]=Math.max(0,Math.min(100,Number(o[key])||0));for(const key of ['color','fill'])if(!/^#[0-9a-f]{6}$/i.test(o[key]||''))delete o[key]})})}if(x.kind==='pdf'){x.content.index=Math.max(0,Math.min(x.content.pages.length-1,Number(x.content.index)||0));x.content.pages.forEach(p=>{p.rotate=[0,90,180,270].includes(+p.rotate)?+p.rotate:0;if(p.ink&&!/^data:image\/png;base64,/.test(p.ink))delete p.ink})}files.push(x);persist();closeModal();openFile(x.id)}else if(/\.csv$/i.test(f.name)){let rows=parseCSV(text.replace(/^\uFEFF/,'')),cells={};rows.slice(0,1000).forEach((r,y)=>r.slice(0,100).forEach((v,x)=>cells[colName(x)+(y+1)]=v));newFile('grid');current.name=name;current.content.sheets[0].cells=cells;changed();render();toast(rows.length>35?'Импортирован CSV. Холст макета показывает первые 35 строк.':'CSV открыт')}else if(/\.(txt|md|html|htm)$/i.test(f.name)){newFile('word');current.name=name;current.content.html=/\.html?$/i.test(f.name)?sanitizeHTML(text):text.split(/\n\s*\n/).map(p=>'<p>'+E(p).replace(/\n/g,'<br>')+'</p>').join('');changed();render()}else throw Error('Этот формат требует движка. Используйте JSON, TXT, MD, HTML или CSV.')}catch(err){toast(err.message||'Не удалось прочитать файл')}finally{e.target.value=''}};
document.getElementById('imageInput').onchange=e=>{let file=e.target.files[0];if(!file)return;if(file.size>3*1024*1024){toast('Для макета выберите изображение до 3 МБ');return}if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){toast('Поддерживаются PNG, JPEG, WebP и GIF');return}const r=new FileReader();r.onload=()=>{closeModal();if(current.kind==='word')insert('<img src="'+r.result+'" alt="Вставленное изображение" style="max-width:100%;height:auto"><p><br></p>');else if(current.kind==='deck'){snapshot();slide().objects.push(obj('img'+Date.now(),'',55,27,34,3,{image:r.result}));changed();render()}};r.readAsDataURL(file);e.target.value=''};
window.addEventListener('beforeunload',()=>{sync();persist()});
try{if(localStorage.getItem('aoc-dark')==='1')document.body.classList.add('dark')}catch{}
render();
</script></body></html>
