name: Normalize public GitHub Release descriptions

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply English text to all published alpha releases (off = preview only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-descriptions:
    if: github.repository == '111nndel/ArtOfficeCraft-Mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate and preview all release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/rewrite_release_metadata.py --output build/release-notes-review
      - name: Update public release descriptions (manual opt-in only)
        if: ${{ inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/rewrite_release_metadata.py --apply --output build/release-notes-review
      - name: Retain reviewed descriptions and original public text
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-descriptions-review
          path: build/release-notes-review/
          if-no-files-found: warn
          retention-days: 7
