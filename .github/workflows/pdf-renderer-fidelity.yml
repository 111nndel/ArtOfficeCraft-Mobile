name: PDF renderer image fidelity

on:
  push:
    branches: ['fidelity/**', 'engine-refresh/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: Compare the pinned PDF renderer with Poppler
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install development-only reference and fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-dejavu-core
          python -m pip install -r tools/pdf_fidelity/requirements.txt
      - name: Generate eight cases and compare the application C ABI
        run: bash tools/pdf_fidelity/run.sh
      - name: Retain images, comparisons and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-renderer-fidelity
          path: build/pdf-renderer-fidelity/results/
          if-no-files-found: warn
          retention-days: 7

  android-reference:
    name: Compare real Rust FFI and Android on the shared fixture
    needs: fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable emulator hardware acceleration
        run: |
          if [[ ! -e /dev/kvm ]]; then
            sudo modprobe kvm
            if grep -q GenuineIntel /proc/cpuinfo; then sudo modprobe kvm_intel; else sudo modprobe kvm_amd; fi
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter and development comparison tools
        run: |
          bash tools/ci/install_flutter.sh
          python -m pip install -r tools/pdf_fidelity/requirements.txt
          bash tools/ci/install_android.sh 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pdf-renderer-fidelity
          path: build/pdf-renderer-fidelity/results/
      - name: Build the application Rust core for the emulator
        run: |
          bash tools/ci/build_native.sh x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp build/native-candidate/libartoffice_core.so android/app/src/main/jniLibs/x86_64/
      - name: Render fixture pages through both real adapters
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/pdf_fidelity/run_android.sh
      - name: Retain three-renderer comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-renderer-fidelity-android
          path: build/pdf-renderer-fidelity/results/
          if-no-files-found: warn
          retention-days: 7
