name: Format reviewed Dart changes
on:
  push:
    branches: ['diagnostics/recent-history']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install pinned Flutter
        run: bash tools/ci/install_flutter.sh
      - name: Format changed Dart source
        run: |
          dart format lib/ui/home_screen.dart lib/workspace/workspace_store.dart lib/l10n/en.dart test/workspace_store_test.dart test/recent_history_test.dart
          python3 - <<'PY'
          from pathlib import Path
          for name in ['lib/ui/home_screen.dart', 'lib/workspace/workspace_store.dart', 'lib/l10n/en.dart', 'test/workspace_store_test.dart', 'test/recent_history_test.dart']:
              print('BEGIN_FORMATTED_FILE:' + name, flush=True)
              print(Path(name).read_text(), end='', flush=True)
              print('END_FORMATTED_FILE:' + name, flush=True)
          PY
