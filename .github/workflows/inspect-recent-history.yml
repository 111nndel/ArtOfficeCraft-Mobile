name: Inspect recent-history QA evidence
on:
  push:
    branches: ['diagnostics/recent-history']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read saved synthetic QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/14278812084/zip" > "$RUNNER_TEMP/recent-history-qa.zip"
          python3 - "$RUNNER_TEMP/recent-history-qa.zip" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in archive.namelist():
                  if name.endswith('recents-021/latest.xml'):
                      print('LATEST RECENT SCREEN')
                      for node in ET.fromstring(archive.read(name)).iter('node'):
                          label = node.attrib.get('text') or node.attrib.get('content-desc')
                          if label:
                              print(repr(label), node.attrib.get('bounds'))
                  elif name.endswith(('summary.json', 'test_recent_imports.log')):
                      print(name)
                      print(archive.read(name).decode('utf-8', errors='replace')[-20000:])
          PY
